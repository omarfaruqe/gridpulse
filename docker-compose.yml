services:
  objectstore:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./data/objectstore:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpulse-dev-secret}
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
